titulo: Ortodoncia e Invisalign
orden: 5
resumen: Brackets o alineadores transparentes, planificados con escáner 3D iTero.
descripcionSeo: 'Ortodoncia e Invisalign en Móstoles para niños y adultos: brackets o alineadores transparentes, planificados con escáner iTero. Primera visita gratuita.'
imagen: ../../assets/cms/servicios/ortodoncia-invisalign/imagen.webp
imagenAlt: Escáner iTero para planificar la ortodoncia invisible
entradilla: La ortodoncia corrige la posición de los dientes y la mordida para que tu boca funcione mejor y sea más fácil de mantener sana. La Dra. Cristina Umérez, con más de 25 años de experiencia en ortodoncia, te explica si en tu caso encajan mejor los brackets o los alineadores transparentes Invisalign.
