titulo: Limpieza bucal
orden: 2
resumen: Ultrasonidos y pulido para eliminar el sarro y la placa.
descripcionSeo: 'Limpieza bucal en Móstoles con ultrasonidos y pulido: eliminamos sarro y placa bajo la encía en unos 30 minutos, sin dolor. Pide tu cita en Up Estudio Dental.'
imagen: ../../assets/cms/servicios/limpieza-bucal/imagen.webp
imagenAlt: Higienista realizando una limpieza a un paciente
entradilla: Retiramos con ultrasonidos el sarro y la placa adheridos al diente y bajo la encía, justo donde el cepillo no llega. Después pulimos el esmalte para que la placa tarde más en volver. Es indoloro; si tienes los dientes sensibles, ajustamos la potencia y aplicamos un gel desensibilizante.
datos:
- icono: euro
  etiqueta: Precio
  valor: Presupuesto tras la revisión
- icono: clock
  etiqueta: Duración
  valor: 30 min, una sesión
- icono: repeat
  etiqueta: Frecuencia
  valor: Al menos 1 vez al año
tarjetas:
  titulo: Señales de que ya te toca
  items:
  - icono: droplet
    titulo: Sangrado al cepillarte
    texto: Es la primera señal de gingivitis. Una encía sana no sangra, por mucho que la cepilles.
  - icono: wind
    titulo: Mal aliento persistente
    texto: La placa acumulada entre el diente y la encía libera compuestos que el cepillado no llega a arrastrar.
  - icono: eye
    titulo: Manchas o sarro visible
    texto: El sarro se ve como una banda amarillenta en la base del diente y ya no se elimina en casa.
  - icono: flame
    titulo: Encía inflamada
    texto: Encías rojas, hinchadas o que se retraen dejando el diente más largo de lo habitual.
beneficios:
  titulo: Qué notarás al salir
  texto: Una sesión al año basta para mantener a raya el sarro; cada seis meses si tienes tendencia a acumularlo.
  items:
  - Previene caries y enfermedad periodontal
  - Frena el sangrado y la inflamación de encías
  - Elimina manchas de café, té y tabaco
  - Mejora el aliento de forma inmediata
  - Deja la superficie pulida, para que la placa tarde más en volver
cierre:
  titulo: Pide tu limpieza bucal
  texto: Escríbenos y buscamos el hueco que mejor te venga. Si hace más de un año de la última, es buen momento.
  mensajeWhatsapp: una limpieza bucal
