biografia: La Dra. Isabel Cristina Sosa Umérez es licenciada en Odontología por la Universidad Europea de Madrid y protésica dental, con un máster en Implantoprótesis dental por la Universidad Rey Juan Carlos. Desde entonces sigue formándose para ofrecer tratamientos actualizados y una atención cercana y meticulosa.
