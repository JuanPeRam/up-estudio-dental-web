name: Update Google Reviews

on:
    schedule:
        # Twice a month (day 1 and day 15) at 06:00 UTC — GitHub Actions
        # cron has no native "every 2 weeks" unit, so this is the closest
        # fixed, predictable approximation to a biweekly refresh.
        - cron: "0 6 1,15 * *"
    workflow_dispatch: {}

permissions:
    contents: write

jobs:
    update-reviews:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Fetch latest Google reviews
              env:
                  GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
                  GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
              run: node scripts/fetch-google-reviews.mjs

            - name: Commit updated reviews cache if it changed
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add src/data/reviews.json
                  git diff --staged --quiet || git commit -m "chore: update Google reviews cache"
                  git push
